server:
  port: 8080

spring:
  profiles:
    active: mock
  application:
    name: core-backend

  datasource:
    # URL kết nối Supabase PostgreSQL sử dụng PgBouncer (Port 6543)
    # Thêm prepareThreshold=0 để tránh lỗi 'prepared statement S_1 already exists' khi dùng chung Pooler
    url: ${DB_URL}&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Cấu hình HikariCP (Connection Pool) chống mất kết nối (Timeout)
    hikari:
      pool-name: SupabaseHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000 # Đóng connection nếu không dùng sau 30s
      connection-timeout: 20000 # Chờ 20s để lấy connection, quá hạn sẽ báo lỗi
      max-lifetime: 1800000 # 30 phút, đảm bảo Supabase không drop connection bất thình lình

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo bảng dựa trên Entity
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Cấu hình giới hạn dung lượng upload file từ máy
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# Cấu hình log để dễ debug
logging:
  level:
    root: INFO
    com.edu.chatbot: DEBUG


# 
# Cấu hình RAG & AI (Phân hệ 4)
# 
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  collection-name: edu_documents

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  rewriting-model: llama-3.1-8b-instant

llm:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  chat-model: llama-3.1-8b-instant
  max-tokens: 2048

rag:
  top-k: 5
  blind-test-probability: 0.2
  chat-memory-size: 5

# ─── Hugging Face Inference API (TV5 - Fine-tuning) ───────────────────────────
huggingface:
  api:
    # HF API Token — lấy tại https://huggingface.co/settings/tokens
    # Giá trị thực tế đặt trong biến môi trường HF_API_TOKEN (xem .env.example)
    token: ${HF_API_TOKEN}
  model:
    # ID model đã fine-tune trên HF Hub — TV5 điền sau khi push model lên
    # Ví dụ: your-username/llama3.1-8b-java-chatbot-lora
    id: ${HF_MODEL_ID:thinhpg1420/llama3.1-8b-java-chatbot-lora}

# ─── OpenRouter API (TV6 - Auto Evaluation / LLM-as-a-Judge) ───────────────────────────
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: https://openrouter.ai/api/v1
  eval-model: google/gemma-2-27b-it

